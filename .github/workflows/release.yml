name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source and tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Require exact project version tag
        run: test "$GITHUB_REF_NAME" = "v0.1.0"
      - name: Validate catalog
        run: python3 tools/update_catalogs.py
      - name: Test, package, cover and create SBOM
        run: ./mvnw -B clean verify spotbugs:check
      - name: Inspect shaded extension JAR
        run: python3 tools/verify_jar.py target/burp-framework-mapper-0.1.0.jar
      - name: Create checksums
        run: |
          cd target
          sha256sum burp-framework-mapper-0.1.0.jar bom.json bom.xml > SHA256SUMS.txt
      - name: Publish immutable GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          target/burp-framework-mapper-0.1.0.jar
          target/bom.json
          target/bom.xml
          target/SHA256SUMS.txt
          --verify-tag
          --title "Burp Framework Mapper v0.1.0"
          --notes-file docs/RELEASE_NOTES_v0.1.0.md
