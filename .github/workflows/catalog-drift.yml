name: Catalog source drift

on:
  schedule:
    - cron: '41 7 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify official artifact digests
        run: python3 tools/update_catalogs.py --verify-upstream
