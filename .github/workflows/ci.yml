name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validate curated catalog
        run: |
          python3 tools/generate_curated_catalog.py
          python3 tools/update_catalogs.py
          git diff --exit-code -- src/main/resources/mappings/correlations.json
      - name: Test, package, cover and create SBOM
        run: ./mvnw -B clean verify
      - name: Run SpotBugs
        run: ./mvnw -B spotbugs:check
      - name: Inspect shaded extension JAR
        run: python3 tools/verify_jar.py target/burp-framework-mapper-0.1.0.jar
      - name: Upload build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: burp-framework-mapper-build
          if-no-files-found: error
          retention-days: 14
          path: |
            target/burp-framework-mapper-0.1.0.jar
            target/bom.json
            target/bom.xml
            target/site/jacoco/jacoco.xml
            target/surefire-reports/*.xml
