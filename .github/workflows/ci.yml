name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validate curated catalog
        run: |
          python3 tools/generate_curated_catalog.py
          python3 tools/update_catalogs.py
          git diff --exit-code -- src/main/resources/mappings/correlations.json
      - name: Test, package, cover and create SBOM
        run: ./mvnw -B clean verify
      - name: Run SpotBugs
        run: ./mvnw -B spotbugs:check
      - name: Inspect shaded extension JAR
        run: python3 tools/verify_jar.py target/burp-framework-mapper-0.1.0.jar
      - name: Upload build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: burp-framework-mapper-build
          if-no-files-found: error
          retention-days: 14
          path: |
            target/burp-framework-mapper-0.1.0.jar
            target/bom.json
            target/bom.xml
            target/site/jacoco/jacoco.xml
            target/surefire-reports/*.xml
